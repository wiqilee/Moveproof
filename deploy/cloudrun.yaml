# Cloud Run service definition for the MoveProof backend.
#
# Apply with:
#   gcloud run services replace deploy/cloudrun.yaml --region=$GCP_REGION
#
# Secrets are referenced, never inlined. Create them first:
#   printf '%s' "$DATABASE_URL"   | gcloud secrets create database-url   --data-file=-
#   printf '%s' "$NEBIUS_API_KEY" | gcloud secrets create nebius-api-key --data-file=-
#   printf '%s' "$TAVILY_API_KEY" | gcloud secrets create tavily-api-key --data-file=-
#
# NEBIUS_ESCALATION_MODEL_ID is not a secret. It names the optional deeper
# reasoning model and uses the existing NEBIUS_API_KEY for authentication.

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: moveproof-backend
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        # A hard ceiling on instances. Cloud Run bills per instance second, so
        # this is the control that actually bounds runaway instance growth.
        autoscaling.knative.dev/maxScale: "4"

        # Scaling to zero is deliberate. MoveProof is used in bursts, so a
        # short cold start is preferable to paying for idle instances.
        autoscaling.knative.dev/minScale: "0"

        run.googleapis.com/cloudsql-instances: PROJECT_ID:REGION:moveproof
        run.googleapis.com/execution-environment: gen2

    spec:
      containerConcurrency: 20
      timeoutSeconds: 300
      serviceAccountName: moveproof-backend@PROJECT_ID.iam.gserviceaccount.com

      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/moveproof/backend:latest

          ports:
            - name: http1
              containerPort: 8080

          resources:
            limits:
              cpu: "1"
              memory: 1Gi

          env:
            - name: MAX_UPLOAD_BYTES
              value: "26214400"

            - name: REQUEST_TIMEOUT_SECONDS
              value: "60"

            # This is the single upper bound used by both model passes.
            - name: MODEL_SAMPLE_ROWS
              value: "5"

            - name: CORS_ORIGINS
              value: "https://moveproof-wiqi.vercel.app"

            # Nebius Token Factory is the only model-inference path.
            - name: NEBIUS_BASE_URL
              value: "https://api.tokenfactory.nebius.com/v1"

            # Routine planning model.
            - name: NEBIUS_MODEL_ID
              value: "nvidia/nemotron-3-super-120b-a12b"

            # Selective reasoning escalation. The deterministic validator, not
            # the model itself, decides whether escalation is warranted.
            #
            # Remove this variable to return to Super-only behavior. No
            # additional secret is required.
            - name: NEBIUS_ESCALATION_MODEL_ID
              value: "nvidia/Nemotron-3-Ultra-550b-a55b"

            - name: MOVEPROOF_VERIFIER_BIN
              value: "/usr/local/bin/moveproof-verifier"

            # External Evidence Check bounds. These are not secrets.
            - name: TAVILY_TIMEOUT_SECONDS
              value: "20"

            - name: TAVILY_MAX_RESULTS
              value: "5"

            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-url
                  key: latest

            - name: NEBIUS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: nebius-api-key
                  key: latest

            # External Evidence Check is backend-only. There is deliberately no
            # NEXT_PUBLIC_ equivalent because that would expose a billable
            # credential to every browser visitor.
            #
            # Cloud Run refuses to deploy a revision that references a missing
            # secret. Create `tavily-api-key` before applying this file, or
            # remove this block to disable External Evidence Check without
            # affecting the core migration workflow.
            - name: TAVILY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: tavily-api-key
                  key: latest

          startupProbe:
            httpGet:
              path: /health
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12

          livenessProbe:
            httpGet:
              path: /health
            periodSeconds: 30

  traffic:
    - percent: 100
      latestRevision: true
