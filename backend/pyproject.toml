[project]
name = "moveproof-backend"
version = "0.1.0"
description = "Deterministic migration core for MoveProof"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
